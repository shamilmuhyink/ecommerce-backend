services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/ecommerce-backend:staging
    container_name: ecommerce_backend_staging
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./.env.staging:/app/.env.staging:ro
    # Optional: healthcheck if you want docker to auto-restart the container on failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis_staging
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
