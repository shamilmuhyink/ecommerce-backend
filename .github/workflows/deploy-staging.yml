name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.staging
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy-to-oci:
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose file to OCI
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "docker-compose.staging.yml"
          target: "/home/ubuntu/"

      - name: Execute deployment on OCI via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            # Pull Vault CLI if not installed, or assume it's set up
            # Retrieve secrets using Hashicorp Vault
            export VAULT_ADDR="${{ secrets.VAULT_ADDR }}"
            export VAULT_TOKEN="${{ secrets.VAULT_TOKEN }}"
            
            # Navigate to application directory
            sudo mkdir -p /opt/ecommerce
            sudo chown -R ubuntu:ubuntu /opt/ecommerce
            mv /home/ubuntu/docker-compose.staging.yml /opt/ecommerce/
            cd /opt/ecommerce
            
            # Fetch secrets from Hashicorp Vault and write to env files
            echo "Fetching secrets from Vault..."
            vault kv get -format=json secret/staging/ecommerce-backend | jq -r '.data.data | to_entries[] | "\(.key)=\(.value)"' > .env.staging
            
            # Also copy as .env for docker-compose env_file directive
            cp .env.staging .env
            
            # Verify .env.staging is not empty (vault may be sealed or token expired)
            if [ ! -s .env.staging ]; then
              echo "ERROR: .env.staging file is empty! Vault extraction failed. Is Vault unsealed?"
              vault status || true
              exit 1
            fi
            echo ".env.staging file created with $(wc -l < .env.staging) variables."
            
            # Export environment variable for docker-compose
            export GITHUB_REPOSITORY_OWNER="${{ github.repository_owner }}"

            # Pull the latest backend image
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            
            # Force-remove ALL old backend containers (including hash-prefixed ones)
            docker ps -a --filter "name=ecommerce_backend_staging" -q | xargs -r docker rm -f 2>/dev/null || true
            
            # Run Alembic migrations against Supabase
            # docker compose -f docker-compose.staging.yml run --rm backend alembic upgrade head
            
            # Restart the services
            docker compose -f docker-compose.staging.yml down
            docker compose -f docker-compose.staging.yml up -d
            
            # Cleanup unused images
            docker image prune -f
